<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dardasha - دردشة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{padding:15px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.logo{font-weight:900;font-size:22px;color:#ff3b5c}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px}
.me{align-self:flex-end;background:#ff3b5c;color:#fff;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#222;border:1px solid #333;border-bottom-left-radius:4px}
.system{align-self:center;background:#1a1a1a;color:#888;font-size:12px;padding:6px 12px;border-radius:20px}
footer{padding:10px;background:#1a1a1a;display:flex;gap:8px;border-top:1px solid #333;position:sticky;bottom:0}
input{flex:1;background:#222;border:1px solid #333;color:#fff;padding:12px 15px;border-radius:25px;outline:none}
button{background:#ff3b5c;color:#fff;border:none;padding:12px 20px;border-radius:25px;font-weight:bold}
.online{font-size:12px;color:#25d366}
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;text-align:center}
.start h1{font-size:32px}
.start p{color:#aaa}
.bigbtn{font-size:18px;padding:15px 40px;border-radius:30px}
</style>
</head>
<body>
<header>
<div class="logo">DARDASHA</div>
<div class="online">● 1,248 متصل</div>
</header>

<div id="startScreen" class="start">
<h1>مرحبا بك في دردشة 💬</h1>
<p>دردش مع ناس عشوائيين من المغرب بكل حرية</p>
<button class="bigbtn" onclick="startChat()">ابدأ الدردشة الآن</button>
<p style="font-size:11px;color:#666">بالضغط توافق على شروط الاستخدام - 18+ فقط</p>
</div>

<div id="chat" style="display:none"></div>

<footer id="footer" style="display:none">
<input id="msgInput" placeholder="كتب رسالة..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">إرسال</button>
</footer>

<script>
const names=["سلمى","أيوب","نور","يوسف","إكرام","أمين","دعاء","رضا"];
let started=false;
function startChat(){
document.getElementById('startScreen').style.display='none';
document.getElementById('chat').style.display='flex';
document.getElementById('footer').style.display='flex';
started=true;
addMsg('تم توصيلك مع شخص عشوائي...','system');
setTimeout(()=>{ addMsg('هلا 😊','other'); },1200);
}
function addMsg(t,cls){
const c=document.getElementById('chat');
const d=document.createElement('div');
d.className='msg '+cls;
d.textContent=t;
c.appendChild(d);
c.scrollTop=c.scrollHeight;
}
function send(){
const i=document.getElementById('msgInput');
if(!i.value.trim())return;
addMsg(i.value,'me');
const txt=i.value;
i.value='';
setTimeout(()=>{
const replies=["هههه","بالصح؟","منين نتا؟","أنا من طنجة ونتا؟","شنو كتدير فالحياة؟","😂😂","واخا","مزيان","صافي فهمت"];
addMsg(replies[Math.floor(Math.random()*replies.length)],'other');
},1000+Math.random()*1000);
}
</script>
</body>
</html>
